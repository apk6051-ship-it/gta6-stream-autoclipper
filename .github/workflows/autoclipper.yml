name: GTA 6 Stream Auto-Clipper

on:
  schedule:
    # Runs every 2 hours UTC: at minute 0 past every 2nd hour
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime!

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg
        run: |
          which ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Credentials from Secrets
        run: |
          if [ -n "${{ secrets.YOUTUBE_CLIENT_SECRET }}" ]; then
            echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > client_secret.json
            echo "client_secret.json restored."
          fi
          if [ -n "${{ secrets.YOUTUBE_TOKEN }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json
            echo "token.json restored."
          fi
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo '${{ secrets.YOUTUBE_COOKIES }}' > cookies.txt
            echo "cookies.txt restored."
          fi

      - name: Run Auto-Clipper Session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.main

      - name: Save Processed Videos History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "processed_videos.txt" ]; then
            git add processed_videos.txt
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record processed video id" && git push)
          fi
